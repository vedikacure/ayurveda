<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You - Vedikacure Ayurveda</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }

    body { 
      background-color: #d1e7dd; 
      color: #1a382b; 
      min-height: 100vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      padding: 20px 10px; 
    }

    .card { 
      background: #ffffff; 
      max-width: 480px; 
      width: 100%; 
      border-radius: 20px; 
      text-align: center; 
      padding: 35px 24px; 
      box-shadow: 0 20px 40px rgba(13, 61, 44, 0.15); 
      border: 1px solid #c3e6cb; 
    }

    .icon-badge {
      width: 80px;
      height: 80px;
      background: #e7f3ec;
      color: #16a34a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      font-size: 40px;
      border: 2px solid #d0e7d9;
    }

    .brand-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #e7f3ec;
      color: #144d37;
      font-size: 11px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 20px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 { 
      font-size: 20px; 
      color: #144d37; 
      margin-bottom: 12px; 
      font-weight: 800; 
      line-height: 1.4; 
    }

    p { 
      font-size: 13.5px; 
      color: #4a6356; 
      line-height: 1.5; 
      margin-bottom: 20px; 
    }

    .info-box { 
      background: #f4f9f6; 
      border: 1px dashed #16a34a; 
      padding: 12px; 
      border-radius: 10px; 
      font-size: 13px; 
      color: #144d37; 
      font-weight: 700; 
      margin-bottom: 24px; 
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .info-btn { 
      display: inline-flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px;
      width: 100%; 
      padding: 14px; 
      background: #144d37; 
      color: white; 
      text-decoration: none; 
      font-size: 14px; 
      font-weight: 800; 
      border-radius: 10px; 
      box-shadow: 0 4px 15px rgba(20, 77, 55, 0.25); 
      text-transform: uppercase; 
      transition: background 0.2s;
    }

    .info-btn:hover {
      background: #0d3828;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon-badge">
      <i class="fa-solid fa-circle-check"></i>
    </div>

    <div class="brand-tag">
      <i class="fa-solid fa-leaf"></i> VEDIKACURE AYURVEDA
    </div>

    <h1>Aapki Doctor Call Consultation Booking Successfully Ho Gayi Hai!</h1>
    
    <p>Humare Ayurvedic Expert Doctor jald se jald aapko consultation aur kit ki jaankari ke liye contact karenge.</p>

    <div class="info-box">
      <i class="fa-solid fa-clock"></i> Expected Call Time: 15 - 30 Minutes
    </div>

    <a href="https://www.instagram.com/ravi1_._/" target="_blank" class="info-btn">
      Get More Info <i class="fa-solid fa-arrow-right"></i>
    </a>
  </div>

</body>
</html>
